name: Deploy Clubverse to GCP VM

on:
  push:
    branches:
      - main  # Only deploy from main, lapreviademo uses deploy.yml
  workflow_dispatch:  # Allow manual triggers

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Create deployment archive
        run: |
          mkdir -p deploy/frontend
          cp -r backend deploy/
          # Copy entire .next folder with all files (including BUILD_ID)
          cp -r frontend/.next deploy/frontend-next
          # Verify BUILD_ID exists
          if [ ! -f "frontend/.next/BUILD_ID" ]; then
            echo "❌ BUILD_ID missing - build may be incomplete"
            exit 1
          fi
          cp frontend/package.json frontend/package-lock.json deploy/frontend/
          cp frontend/next.config.js deploy/frontend/ 2>/dev/null || true
          cp frontend/public deploy/frontend/ -r 2>/dev/null || true
          tar -czf deploy.tar.gz deploy/

      - name: Deploy to GCP VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"

      - name: Run deployment script on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          script: |
            DEPLOY_PATH="${{ secrets.VM_DEPLOY_PATH || '/home/nexlx99/clubverse' }}"
            cd "$DEPLOY_PATH" || mkdir -p "$DEPLOY_PATH" && cd "$DEPLOY_PATH"
            
            # Extract deployment
            tar -xzf /tmp/deploy.tar.gz -C /tmp/
            
            # Clean up old backups (keep last 2)
            find . -maxdepth 1 -type d -name "backend.backup.*" | sort -r | tail -n +3 | xargs rm -rf 2>/dev/null || true
            
            # Deploy backend
            echo "Deploying backend..."
            mkdir -p backend
            rm -rf backend/*
            cp -r /tmp/deploy/backend/* backend/ 2>/dev/null || echo "No backend files to copy"
            
            # Deploy frontend
            echo "Deploying frontend..."
            mkdir -p frontend
            # Remove old .next atomically by moving to temp first
            if [ -d "frontend/.next" ]; then
              mv frontend/.next frontend/.next.old.$(date +%s) || rm -rf frontend/.next
            fi
            # Copy new .next folder
            cp -r /tmp/deploy/frontend-next frontend/.next
            # Verify BUILD_ID exists
            if [ ! -f "frontend/.next/BUILD_ID" ]; then
              echo "❌ BUILD_ID missing after copy - deployment may be incomplete"
              exit 1
            fi
            # Copy other frontend files
            cp /tmp/deploy/frontend/package*.json frontend/ 2>/dev/null || true
            cp /tmp/deploy/frontend/next.config.js frontend/ 2>/dev/null || true
            cp -r /tmp/deploy/frontend/public frontend/ 2>/dev/null || true
            # Clean up old .next backups (keep last 2)
            find frontend -maxdepth 1 -type d -name ".next.old.*" | sort -r | tail -n +3 | xargs rm -rf 2>/dev/null || true
            
            # Install backend dependencies if needed
            if [ -f "backend/requirements.txt" ]; then
              echo "Installing backend dependencies..."
              source backend/venv/bin/activate 2>/dev/null || python3 -m venv backend/venv && source backend/venv/bin/activate
              pip install -q --upgrade pip
              pip install -q -r backend/requirements.txt
            fi
            
            # Install frontend dependencies if needed
            if [ -f "frontend/package.json" ]; then
              echo "Installing frontend dependencies..."
              cd frontend
              npm ci --production 2>/dev/null || npm install --production
              cd ..
            fi
            
            # Restart services
            echo "Restarting services..."
            
            # Restart backend
            echo "Restarting backend..."
            sudo systemctl restart clubverse-backend && echo "✅ Backend restarted" || echo "❌ Backend restart failed"
            
            # Restart frontend
            echo "Restarting frontend..."
            sudo systemctl restart clubverse-frontend && echo "✅ Frontend restarted" || echo "❌ Frontend restart failed"
            
            # Give services time to start
            sleep 3
            
            # Reload nginx (not restart - config is immutable)
            sudo systemctl reload nginx 2>/dev/null || echo "Nginx reload skipped"
            
            # Wait for services to be ready
            sleep 5
            
            # Verify frontend is responding
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Frontend is responding on localhost:3000"
            else
              echo "⚠️ Frontend not responding - checking logs..."
              sudo journalctl -u clubverse-frontend -n 10 --no-pager || true
            fi
            
            # Verify backend is responding
            if curl -sf http://localhost:8000/docs > /dev/null 2>&1; then
              echo "✅ Backend is responding on localhost:8000"
            else
              echo "⚠️ Backend not responding - checking logs..."
              sudo journalctl -u clubverse-backend -n 10 --no-pager || true
            fi
            
            # Cleanup
            rm -f /tmp/deploy.tar.gz
            rm -rf /tmp/deploy
            
            echo "✅ Deployment completed!"
